name: ci
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: opsassist, POSTGRES_PASSWORD: opsassist, POSTGRES_DB: opsassist}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U opsassist" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      OPSASSIST_ENV: test
      OPSASSIST_DATABASE_URL: postgresql+psycopg://opsassist_app:opsassist_app_dev@localhost:5432/opsassist
      OPSASSIST_MIGRATION_DATABASE_URL: postgresql+psycopg://opsassist:opsassist@localhost:5432/opsassist
      OPSASSIST_REDIS_URL: redis://localhost:6379/0
      # No Ollama in CI: index with the deterministic 768-d mock embedder.
      OPSASSIST_INDEX_EMBEDDING_MODEL: mock/embed-768
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations evaluation scripts
      - run: uv run ruff format --check src tests migrations evaluation scripts
      - run: uv run mypy src
      - run: uv run pytest -m "not integration"
      - run: uv run alembic upgrade head && uv run python -m opsassist.seed
      - run: uv run python -m opsassist.knowledge.ingest --inline
      - name: API + worker smoke and integration tests
        # Start the API and worker from the venv directly (not `uv run`) and always stop them:
        # a leftover process holds uv's cache lock and breaks setup-uv's post-job cache prune.
        run: |
          .venv/bin/uvicorn opsassist.main:create_app --factory --port 8000 &
          SERVER_PID=$!
          .venv/bin/dramatiq opsassist.worker --processes 1 --threads 1 &
          WORKER_PID=$!
          trap 'kill $SERVER_PID $WORKER_PID 2>/dev/null; wait 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && break; sleep 1; done
          curl -sf localhost:8000/readyz
          uv run pytest -m integration
      - name: Container build
        run: docker build -t opsassist:ci .
