name: ci
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: opsassist, POSTGRES_PASSWORD: opsassist, POSTGRES_DB: opsassist}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U opsassist" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      OPSASSIST_ENV: test
      OPSASSIST_DATABASE_URL: postgresql+psycopg://opsassist:opsassist@localhost:5432/opsassist
      OPSASSIST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests migrations
      - run: uv run mypy src
      - run: uv run pytest -m "not integration"
      - run: uv run alembic upgrade head && uv run python -m opsassist.seed
      - name: API smoke + integration tests
        run: |
          uv run uvicorn opsassist.main:create_app --factory --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && break; sleep 1; done
          uv run pytest -m integration
      - name: Container build
        run: docker build -t opsassist:ci .
