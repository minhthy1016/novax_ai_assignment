# Local reproducible deployment. Ports bind to 127.0.0.1 only (safe default).
# Optional profiles (added later): `observability` (Opik + Prometheus), `ui` (Flowise demo client).

x-app-env: &app-env
  OPSASSIST_ENV: ${OPSASSIST_ENV:-dev}
  OPSASSIST_LOG_LEVEL: ${OPSASSIST_LOG_LEVEL:-INFO}
  # Runtime role (least privilege, subject to row-level security) vs schema owner.
  OPSASSIST_DATABASE_URL: postgresql+psycopg://opsassist_app:${OPSASSIST_APP_DB_PASSWORD:-opsassist_app_dev}@postgres:5432/${POSTGRES_DB:-opsassist}
  OPSASSIST_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opsassist}:${POSTGRES_PASSWORD:-opsassist}@postgres:5432/${POSTGRES_DB:-opsassist}
  OPSASSIST_APP_DB_PASSWORD: ${OPSASSIST_APP_DB_PASSWORD:-opsassist_app_dev}
  OPSASSIST_REDIS_URL: redis://redis:6379/0
  OPSASSIST_JWT_SECRET: ${OPSASSIST_JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}
  OPSASSIST_INDEX_EMBEDDING_MODEL: ${OPSASSIST_INDEX_EMBEDDING_MODEL:-ollama/nomic-embed-text}
  OPSASSIST_ROUTER_MODEL: ${OPSASSIST_ROUTER_MODEL:-ollama/llama3.2-3b}
  OPSASSIST_RATE_LIMIT_PER_MINUTE: ${OPSASSIST_RATE_LIMIT_PER_MINUTE:-300}
  OPSASSIST_RATE_LIMIT_BURST: ${OPSASSIST_RATE_LIMIT_BURST:-100}
  OPSASSIST_RATE_LIMIT_EXPENSIVE_PER_MINUTE: ${OPSASSIST_RATE_LIMIT_EXPENSIVE_PER_MINUTE:-60}
  OPSASSIST_RATE_LIMIT_EXPENSIVE_BURST: ${OPSASSIST_RATE_LIMIT_EXPENSIVE_BURST:-30}
  # Provider keys are read from the caller's environment or .env; never written here.
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsassist}
      POSTGRES_DB: ${POSTGRES_DB:-opsassist}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: apply migrations, then seed identity/inventory fixtures. API waits for success.
  migrate:
    build: .
    environment: *app-env
    command: ["sh", "-c", "alembic upgrade head && python -m opsassist.agent.checkpointer && python -m opsassist.seed"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build: .
    environment: *app-env
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]  # reach Ollama on the host (Linux too)
    # Uploaded documents are written by the API and read by the worker, so they live on a
    # shared volume. In production this is object storage (S3/MinIO), not a local mount.
    volumes: [uploads:/app/sample_data/knowledge/uploads]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

  # Background worker: ingestion / re-indexing with retries and a dead-letter queue.
  worker:
    build: .
    environment: *app-env
    command: ["dramatiq", "opsassist.worker", "--processes", "1", "--threads", "2"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [uploads:/app/sample_data/knowledge/uploads]
    # The image's HTTP health check is for the API; the worker's liveness is its broker link.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; redis.Redis.from_url(os.environ['OPSASSIST_REDIS_URL']).ping()"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
